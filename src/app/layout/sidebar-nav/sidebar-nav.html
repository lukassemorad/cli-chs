<div hlmSidebarHeader>
  <div class="flex items-center gap-2 overflow-hidden px-2 py-1">
    <span
      class="flex size-6 shrink-0 items-center justify-center rounded-md bg-primary text-xs font-bold text-primary-foreground"
    >
      S
    </span>
    <span class="truncate text-sm font-semibold group-data-[collapsible=icon]:hidden">
      spartan-project
    </span>
  </div>
</div>

<div hlmSidebarContent>
  <div hlmSidebarGroup>
    <div hlmSidebarGroupLabel>Navigace</div>
    <ul hlmSidebarMenu>
      @for (item of navItems; track item.key) {
        <li hlmSidebarMenuItem>
          <button
            hlmSidebarMenuButton
            [isActive]="activeKey() === item.key"
            (click)="activeKey.set(item.key)"
          >
            <ng-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
          </button>
        </li>
      }
    </ul>
  </div>
</div>

<div hlmSidebarFooter>
  <span hlmBadge variant="secondary">test playground</span>
</div>
