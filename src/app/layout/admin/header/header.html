<header class="flex items-center justify-between gap-3 border-b border-border px-4 py-3">
  <div class="flex items-center gap-3">
    <button hlmSidebarTrigger aria-label="Přepnout postranní panel"></button>
    <span class="text-sm font-medium text-muted-foreground">Administrace</span>
  </div>
  <div class="flex items-center gap-1">
    <button hlmBtn variant="ghost" size="icon" (click)="theme.toggle()">
      <ng-icon [name]="theme.isDark() ? 'lucideSun' : 'lucideMoon'" />
      <span class="sr-only">Přepnout tmavý režim</span>
    </button>
    <a hlmBtn variant="ghost" size="icon" routerLink="/" aria-label="Zpět na web">
      <ng-icon name="lucideLogOut" />
    </a>
  </div>
</header>
