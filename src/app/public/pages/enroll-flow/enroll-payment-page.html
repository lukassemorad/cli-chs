@if (course(); as course) {
  <div class="mx-auto flex max-w-lg flex-col gap-6">
    <div class="flex flex-col gap-2">
      <h1 class="text-2xl font-semibold">Platba</h1>
      <p class="text-muted-foreground">{{ course.title }}</p>
    </div>

    <div hlmCard>
      <div hlmCardHeader>
        <h3 hlmCardTitle>Shrnutí platby</h3>
        <p hlmCardDescription>
          Toto je mock platba — žádná skutečná platební brána zatím není napojena.
        </p>
      </div>
      <div hlmCardContent>
        <div class="flex items-center justify-between text-lg">
          <span>Cena kurzu</span>
          <span class="font-semibold">{{ course.price }} Kč</span>
        </div>
      </div>
    </div>

    <button hlmBtn class="w-fit" (click)="onPay()">Zaplatit</button>
  </div>
} @else {
  <app-course-not-found />
}
