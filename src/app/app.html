<div hlmSidebarWrapper>
  <hlm-sidebar collapsible="icon">
    <app-sidebar-nav [(activeKey)]="activeNavKey" />
  </hlm-sidebar>

  <main hlmSidebarInset>
    <app-header />

    <div class="mx-auto w-full max-w-4xl px-6 py-10">
      @switch (activeNavKey()) {
        @case ('overview') {
          <app-overview-page />
        }
        @case ('projects') {
          <app-projects-page />
        }
        @case ('settings') {
          <app-settings-page />
        }
      }
    </div>
  </main>
</div>
